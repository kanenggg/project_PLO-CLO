  CD-Deploy:
     needs: [Build-Frontend, Build-Backend]
     runs-on: self-hosted

     steps:
      - name: Deploy to K8s
        run: |
          kubectl apply -f ./PLOCLO_cms/k8s/namespace.yaml
          kubectl apply -f ./PLOCLO_cms/k8s/postgres/
          kubectl apply -f ./PLOCLO_cms/k8s/backend/
          kubectl apply -f ./PLOCLO_cms/k8s/frontend/
          kubectl apply -f ./PLOCLO_cms/k8s/ingress.yaml

      - name: Rollout restart (pull latest image)
        run: |
          kubectl rollout restart deployment/backend -n ploclo
          kubectl rollout restart deployment/frontend -n ploclo
          

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend -n ploclo --timeout=120s
          kubectl rollout status deployment/frontend -n ploclo --timeout=120s
          
  zap-scan:
     needs: CD-Deploy
     runs-on: self-hosted

     steps:
      - name: ZAP Baseline Scan
        run: |
          docker run --rm \
            -v $(pwd):/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://kanenggg.infinix-lab.com/ \
            -r zap-report.html

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html

      - name: Fail if High Risk Found
        run: |
          if grep -q "High" zap-report.html; then
            echo "❌ ZAP found High vulnerabilities"
            exit 1
          fi
