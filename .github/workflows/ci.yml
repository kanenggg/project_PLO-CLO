name: K8s Deployment

on:
  push:
    branches:
      - kan-ploclo

jobs:
  CI-git:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean Docker Image
        run: |
         docker image prune -a -f

  Build-Backend:
    needs: CI-git
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Allow insecure registry
        run: |
          echo '{"insecure-registries": ["${{ secrets.REGISTRY_HOST }}"]}' \
            | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}

      - name: Build and Push Backend
        run: |
          docker build --no-cache -t ${{ secrets.REGISTRY_HOST }}/backend:latest ./PLOCLO_cms/backend
          docker push ${{ secrets.REGISTRY_HOST }}/backend:latest

  Build-Frontend:
    needs: CI-git
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Allow insecure registry
        run: |
          echo '{"insecure-registries": ["${{ secrets.REGISTRY_HOST }}"]}' \
            | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}

      - name: Build and Push Frontend
        run: |
          docker build -t ${{ secrets.REGISTRY_HOST }}/frontend:latest ./PLOCLO_cms/frontend
          docker push ${{ secrets.REGISTRY_HOST }}/frontend:latest

