name: K8s Deployment

on:
  push:
    branches:
      - kan-ploclo

jobs:
  CI-git:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean Docker Image
        run: |
         docker image prune -a -f

  Build-Backend:
    needs: CI-git
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Allow insecure registry
        run: |
          echo '{"insecure-registries": ["${{ secrets.REGISTRY_HOST }}"]}' \
            | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}

      - name: Build and Push Backend
        run: |
          docker build --no-cache -t ${{ secrets.REGISTRY_HOST }}/backend:latest ./PLOCLO_cms/backend
          docker push ${{ secrets.REGISTRY_HOST }}/backend:latest

  Build-Frontend:
    needs: CI-git
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Allow insecure registry
        run: |
          echo '{"insecure-registries": ["${{ secrets.REGISTRY_HOST }}"]}' \
            | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}

      - name: Build and Push Frontend
        run: |
          docker build -t ${{ secrets.REGISTRY_HOST }}/frontend:latest ./PLOCLO_cms/frontend
          docker push ${{ secrets.REGISTRY_HOST }}/frontend:latest

  trivy-scan:
    needs: [Build-Frontend, Build-Backend]
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure insecure registry
        run: |
          echo '{"insecure-registries":["${{ secrets.REGISTRY_HOST }}"]}' \
            | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          sleep 3

      - name: Login to registry
        run: |
          echo "${{ secrets.REGISTRY_PASS }}" | docker login \
            ${{ secrets.REGISTRY_HOST }} \
            -u "${{ secrets.REGISTRY_USER }}" \
            --password-stdin

      - name: Trivy scan - Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.REGISTRY_HOST }}/frontend:latest"
          format: "json"
          output: "trivy-results-frontend.json"
          scanners: "vuln,secret"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          insecure: true
        env:
          TRIVY_INSECURE: "true"
          TRIVY_NON_SSL: "true"

      - name: Trivy scan - Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.REGISTRY_HOST }}/backend:latest"
          format: "json"
          output: "trivy-results-backend.json"
          scanners: "vuln,secret"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          insecure: true
        env:
          TRIVY_INSECURE: "true"
          TRIVY_NON_SSL: "true"

      - name: Count CRITICAL and HIGH
        id: count
        run: |
          for IMAGE in frontend backend; do
            FILE="trivy-results-${IMAGE}.json"

            CRITICAL=$(cat $FILE | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length')
            HIGH=$(cat $FILE | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length')

            echo "=== myapp-${IMAGE} ==="
            echo "🔴 Critical : $CRITICAL"
            echo "🟠 High     : $HIGH"

            echo "critical_${IMAGE}=$CRITICAL" >> $GITHUB_OUTPUT
            echo "high_${IMAGE}=$HIGH"         >> $GITHUB_OUTPUT
          done

          TOTAL_CRITICAL=$(( \
            $(cat trivy-results-frontend.json | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length') + \
            $(cat trivy-results-backend.json  | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length') \
          ))

          TOTAL_HIGH=$(( \
            $(cat trivy-results-frontend.json | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length') + \
            $(cat trivy-results-backend.json  | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length') \
          ))

          echo ""
          echo "=== Total (all images) ==="
          echo "🔴 Critical : $TOTAL_CRITICAL"
          echo "🟠 High     : $TOTAL_HIGH"

          echo "total_critical=$TOTAL_CRITICAL" >> $GITHUB_OUTPUT
          echo "total_high=$TOTAL_HIGH"         >> $GITHUB_OUTPUT

      - name: Fail if CRITICAL, HIGH found
        run: |
          if [ "${{ steps.count.outputs.total_critical }},"${{ steps.count.outputs.total_high }}" -gt "0" ]; then
            echo "❌ พบ CRITICAL ${{ steps.count.outputs.total_critical }} รายการ — หยุด pipeline"
            echo "❌ พบ HIGH ${{ steps.count.outputs.total_high }} รายการ — หยุด pipeline"
            exit 1
          fi
          echo "✅ ผ่าน — ไม่พบ CRITICAL"


